<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e18" />
      <stop offset="100%" stop-color="#070c09" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark obsidian backdrop with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Neon Glowing Tech Curly Braces { } + S icon -->
  <g filter="url(#glow)" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Brace { -->
    <path d="M 21 16 C 18 16 16 19 16 23 L 16 28 C 16 30 13 32 13 32 C 13 32 16 34 16 36 L 16 41 C 16 45 18 48 21 48" />

    <!-- Right Brace } -->
    <path d="M 43 16 C 46 16 48 19 48 23 L 48 28 C 48 30 51 32 51 32 C 51 32 48 34 48 36 L 48 41 C 48 45 46 48 43 48" />

    <!-- Center Tech S / Forge Glyph -->
    <path d="M 37 23 L 28 23 C 26 23 25 24.5 25 26.5 C 25 29 27 30 32 31 C 37 32 39 33.5 39 36.5 C 39 39.5 37 41 34 41 L 26 41" stroke-width="3.2" />
  </g>
</svg>
